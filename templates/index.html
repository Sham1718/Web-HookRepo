<!DOCTYPE html>
<html>
<head>
    <title>GitHub Webhook Events</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }

        h1 {
            text-align: center;
        }

        .event {
            background: white;
            padding: 15px;
            margin: 10px auto;
            max-width: 600px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<h1>Latest Repository Events</h1>
<div id="events"></div>

<script>
    async function fetchEvents() {
        const response = await fetch("/events");
        const data = await response.json();

        const container = document.getElementById("events");
        container.innerHTML = "";

        data.forEach(event => {
            const div = document.createElement("div");
            div.className = "event";

            let text = "";

            if (event.action === "PUSH") {
                text = `${event.author} pushed to ${event.to_branch} on ${new Date(event.timestamp).toUTCString()}`;
            }

            if (event.action === "PULL_REQUEST") {
                text = `${event.author} submitted a pull request from ${event.from_branch} to ${event.to_branch} on ${new Date(event.timestamp).toUTCString()}`;
            }

            if (event.action === "MERGE") {
                text = `${event.author} merged branch ${event.from_branch} to ${event.to_branch} on ${new Date(event.timestamp).toUTCString()}`;
            }

            div.innerText = text;
            container.appendChild(div);
        });
    }

    fetchEvents();
    setInterval(fetchEvents, 15000);
</script>

</body>
</html>
